<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>君威钢绳索具 · 智能排产助手</title>
<style>
:root{
  --bg:#0E1419; --panel:#151D25; --panel2:#1B242E; --line:#26333F; --line2:#31424F;
  --ink:#E6EDF3; --mut:#8CA0B1; --dim:#5E7384;
  --p1:#3FA9C9; --p2:#E0A94B; --p3:#5FB97A;
  --risk:#E4574C; --warn:#E3A63A; --ok:#5FB97A; --lock:#B57FE0;
  --radius:3px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: light){:root:not([data-theme="light"]){}}
:root[data-theme="dark"]{}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--p1)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2C3B49;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
header.top{
  display:flex;align-items:center;gap:14px;padding:9px 14px;
  background:linear-gradient(180deg,#18222C,#121A22);
  border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;
  padding-top:calc(9px + env(safe-area-inset-top,0px));
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
.brand b{font-size:15px;font-weight:650;letter-spacing:.2px}
.brand span{font-size:11px;color:var(--dim)}
.topspace{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line2);
  border-radius:99px;font-size:11.5px;color:var(--mut);background:#131C24;white-space:nowrap;
}
.pill b{color:var(--ink);font-weight:600}
.btn{
  padding:6px 12px;border:1px solid var(--line2);border-radius:var(--radius);
  background:#1C2833;color:var(--ink);font-size:12.5px;white-space:nowrap;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:#243342;border-color:#3E5568}
.btn:focus-visible{outline:2px solid var(--p1);outline-offset:1px}
.btn.pri{background:var(--p1);border-color:var(--p1);color:#06171D;font-weight:650}
.btn.pri:hover{background:#55BCDB}
.btn.dgr{border-color:#6B3833;color:#F0A39C;background:#241A19}
.btn.dgr:hover{background:#31201E}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

nav.tabs{display:flex;gap:0;background:#121A22;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto}
nav.tabs button{
  padding:9px 16px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--p1);background:#18222C}

main{flex:1;overflow:auto;padding:14px}
.view{display:none}
.view.on{display:block}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
.panel>h3{
  margin:0;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--ink);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.panel>h3 .sub{font-weight:400;color:var(--dim);font-size:11.5px}
.panel>h3 .sp{flex:1}
.pad{padding:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--p1);border-radius:var(--radius);padding:10px 12px}
.kpi .lab{font-size:11.5px;color:var(--mut)}
.kpi .val{font-size:25px;font-weight:600;letter-spacing:-.5px;margin-top:2px;line-height:1.1}
.kpi .val small{font-size:13px;font-weight:400;color:var(--mut);margin-left:2px}
.kpi .dlt{font-size:11.5px;margin-top:3px;color:var(--dim)}
.kpi.risk{border-left-color:var(--risk)} .kpi.warn{border-left-color:var(--warn)}
.kpi.ok{border-left-color:var(--ok)} .kpi.p2{border-left-color:var(--p2)}
.up{color:var(--ok)} .down{color:var(--risk)}

/* ---------- table ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:11.5px;background:#18212A;position:sticky;top:0;z-index:2}
tbody tr:hover{background:#1A242E}
tbody tr.sel{background:#1E2E3A}
td.num,th.num{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}

/* ---------- tags ---------- */
.tag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:11px;border:1px solid;line-height:1.5}
.t-p1{color:var(--p1);border-color:#2A6072;background:#122430}
.t-p2{color:var(--p2);border-color:#6B5423;background:#241F12}
.t-p3{color:var(--p3);border-color:#2F6640;background:#13251A}
.t-risk{color:var(--risk);border-color:#6B3833;background:#241615}
.t-warn{color:var(--warn);border-color:#6B5423;background:#241F12}
.t-ok{color:var(--ok);border-color:#2F6640;background:#13251A}
.t-mut{color:var(--mut);border-color:var(--line2);background:#182028}
.t-lock{color:var(--lock);border-color:#513B66;background:#1E1828}

/* ---------- gantt ---------- */
.gwrap{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.gscroll{overflow:auto;max-height:62vh}
.grow{display:flex;border-bottom:1px solid #1E2831;min-height:26px}
.grow:hover{background:#18222B}
.glab{
  flex:0 0 152px;position:sticky;left:0;z-index:3;background:#161F27;
  border-right:1px solid var(--line);padding:4px 8px;font-size:11.5px;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.glab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glab .ut{color:var(--dim);font-size:10.5px;flex:0 0 auto}
.gtrack{position:relative;flex:1;min-height:26px}
.gbar{
  position:absolute;top:3px;height:20px;border-radius:2px;font-size:10.5px;line-height:20px;
  padding:0 5px;overflow:hidden;white-space:nowrap;cursor:pointer;color:#06171D;font-weight:600;
  border:1px solid rgba(0,0,0,.35);
}
.gbar:hover{filter:brightness(1.18);z-index:4}
.gbar.sel{outline:2px solid #fff;outline-offset:-1px;z-index:5}
.gbar.late{box-shadow:inset 0 -3px 0 var(--risk)}
.gbar.locked::after{content:"◆";margin-left:4px;opacity:.75}
.gchg{position:absolute;top:3px;height:20px;background:repeating-linear-gradient(45deg,#4A5766,#4A5766 3px,#3A4653 3px,#3A4653 6px);border-radius:2px 0 0 2px;opacity:.9}
.gdown{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(228,87,76,.28),rgba(228,87,76,.28) 5px,rgba(228,87,76,.12) 5px,rgba(228,87,76,.12) 10px);border-left:1px solid var(--risk);border-right:1px solid var(--risk)}
.ghead{display:flex;position:sticky;top:0;z-index:6;background:#131B23;border-bottom:1px solid var(--line2)}
.ghl{flex:0 0 152px;position:sticky;left:0;z-index:7;background:#131B23;border-right:1px solid var(--line);padding:5px 8px;font-size:11px;color:var(--mut)}
.ghd{position:relative;flex:1;height:28px}
.gtick{position:absolute;top:0;bottom:0;border-left:1px solid #22303C;font-size:10px;color:var(--dim);padding:6px 0 0 4px}
.gtick.day{border-left-color:#33475A}
.gnow{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--p2);z-index:5;pointer-events:none}
.glegend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line)}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);background:var(--panel2);
  border-left:1px solid var(--line2);z-index:60;transform:translateX(100%);
  transition:transform .18s ease;display:flex;flex-direction:column;
  box-shadow:-12px 0 32px rgba(0,0,0,.5);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.on{transform:translateX(0)}
.drawer h4{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:center}
.drawer .body{flex:1;overflow:auto;padding:14px}
.drawer .foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:82px 1fr;gap:4px 10px;font-size:12px;margin-bottom:12px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
.why{border-left:2px solid var(--p1);padding:7px 10px;background:#141E27;margin-bottom:7px;font-size:12px;border-radius:0 2px 2px 0}
.why b{color:var(--p1);font-weight:600}
.why.w2{border-left-color:var(--p2)} .why.w2 b{color:var(--p2)}
.why.w3{border-left-color:var(--p3)} .why.w3 b{color:var(--p3)}
.why.wr{border-left-color:var(--risk)} .why.wr b{color:var(--risk)}
.scrim{position:fixed;inset:0;background:rgba(5,9,12,.55);z-index:55;display:none}
.scrim.on{display:block}

/* ---------- forms ---------- */
label.f{display:block;font-size:11.5px;color:var(--mut);margin:9px 0 3px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;padding:5px 8px;background:#101820;border:1px solid var(--line2);
  border-radius:var(--radius);font-size:12.5px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:120px}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.55}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.chk input{width:auto;flex:0 0 auto}

/* ---------- misc ---------- */
.bars{display:flex;flex-direction:column;gap:3px}
.bl{display:flex;align-items:center;gap:8px;font-size:11.5px}
.bl .n{flex:0 0 120px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .t{flex:1;height:13px;background:#101820;border-radius:2px;overflow:hidden;position:relative}
.bl .t i{display:block;height:100%;background:var(--p1)}
.bl .v{flex:0 0 52px;text-align:right;color:var(--mut)}
.risklist{display:flex;flex-direction:column;gap:6px}
.ri{display:flex;gap:9px;padding:7px 10px;background:#141C24;border-left:3px solid var(--warn);border-radius:0 2px 2px 0;font-size:12px;align-items:flex-start}
.ri.r1{border-left-color:var(--risk)}
.ri .ic{flex:0 0 auto;font-weight:700;color:var(--warn)}
.ri.r1 .ic{color:var(--risk)}
.ri .tx{flex:1;line-height:1.5}
.ri .tx b{font-weight:600}
.empty{padding:26px;text-align:center;color:var(--dim);font-size:12.5px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:#22303C;border:1px solid var(--line2);color:var(--ink);padding:9px 16px;
  border-radius:var(--radius);z-index:90;opacity:0;pointer-events:none;transition:.2s;font-size:12.5px;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{position:fixed;inset:0;background:rgba(10,15,20,.72);z-index:95;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:13px;color:var(--mut)}
.busy.on{display:flex}
.spin{width:26px;height:26px;border:2px solid #2C3B49;border-top-color:var(--p1);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
svg.chart{width:100%;height:auto;display:block}
.sgrid{stroke:#22303C;stroke-width:1}
.stxt{fill:var(--dim);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
@media (max-width:720px){
  .glab,.ghl{flex-basis:104px}
  main{padding:9px}
  .kpi .val{font-size:21px}
}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand"><b>君威智能排产助手</b><span>钢绳索具 · 拉丝→捻股→合绳</span></div>
  <span class="pill" id="pHorizon">计划起点 <b>—</b></span>
  <span class="pill" id="pScale">订单 <b>0</b> · 工序 <b>0</b></span>
  <span class="pill">公开演示 · 合成数据</span><a href="/projects/junwei-scheduling/">返回作品集</a><div class="topspace"></div>
  <button class="btn" id="bUndo" disabled>撤销重排</button>
  <button class="btn" id="bSave">保存为方案</button>
  <button class="btn pri" id="bRun">重新排产</button>
</header>
<nav class="tabs" id="tabs">
  <button class="on" data-v="v-dash">总览与风险</button>
  <button data-v="v-plan">排产计划</button>
  <button data-v="v-gantt">甘特图</button>
  <button data-v="v-dis">插单与异常重排</button>
  <button data-v="v-sc">方案对比</button>
  <button data-v="v-ana">生产数据分析</button>
  <button data-v="v-data">数据导入导出</button>
  <button data-v="v-rule">规则与算法</button>
</nav>
<main>
  <section class="view on" id="v-dash"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-gantt"></section>
  <section class="view" id="v-dis"></section>
  <section class="view" id="v-sc"></section>
  <section class="view" id="v-ana"></section>
  <section class="view" id="v-data"></section>
  <section class="view" id="v-rule"></section>
</main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <h4><span id="dwTitle">排产依据</span><span style="flex:1"></span><button class="btn sm" id="dwClose">关闭</button></h4>
  <div class="body" id="dwBody"></div>
  <div class="foot" id="dwFoot"></div>
</aside>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div class="spin"></div><div id="busyTx">正在排产…</div></div>

/* ======================= 规格解析 ======================= */
const OUTER={17:11,18:12,19:12,24:14,34:16,35:16,36:16};
const WIRE_F={7:3,19:5,24:5,25:6,26:7,29:7,31:7,36:7,37:7,41:7,49:8};
function parseSpec(pn,spec){
  const s=String(spec||'').trim();
  let m=s.match(/^([\d.]+)\s*mm\s*(.*)$/i);
  let D=m?parseFloat(m[1]):parseFloat(s)||12;
  let rest=m?m[2].trim():s;
  let par=rest.match(/\(([^)]*)\)/);
  let struct=(par?par[1]:rest).replace(/^GT[0-9A-Z]*\s*/i,'').trim()||rest;
  if(!par&&/^GT/i.test(rest)) struct=rest.replace(/^GT\s*/i,'');
  let core='FC';
  if(/PIWRC/i.test(struct))core='PIWRC'; else if(/IWRC/i.test(struct))core='IWRC';
  else if(/WSC/i.test(struct))core='WSC'; else if(/FC/i.test(struct))core='FC';
  const body=struct.split('+')[0];
  let nm=body.match(/^(\d+)\s*[WwSs]?\s*[*x×]/);
  let n=nm?parseInt(nm[1]):6;
  let cm=body.match(/[*x×]\s*[Kk]?\s*(\d+)/);
  let wires=cm?parseInt(cm[1]):19;
  const nOuter=OUTER[n]||n;
  const sn=Math.sin(Math.PI/Math.max(3,nOuter));
  const dStrand=+(D*sn/(1+sn)).toFixed(3);
  const wf=WIRE_F[wires]||6;
  const dWire=+clamp(dStrand/wf,0.22,5.0).toFixed(3);
  const surf=/镀锌|锌/.test(pn)?'镀锌':(/不锈/.test(pn)?'不锈钢':'光面');
  const plastic=/注塑|涂塑/.test(pn);
  return {D,struct,core,n,nOuter,wires,dStrand,dWire,surf,plastic,
    kDraw:surf+'/'+dWire.toFixed(2),
    kTwist:struct.split('+')[0]+'/'+dStrand.toFixed(2)+'/'+surf,
    kRope:struct+'/'+D.toFixed(1)+'/'+surf};
}
/* ======================= 速率查表 ======================= */
let TWK=null,RPK=null;
function twistLookup(d){
  if(!TWK)TWK=Object.keys(DATA.twistBase).map(k=>[Number(k),k]).sort((a,b)=>a[0]-b[0]);
  let best=TWK[0],bd=1e9;
  for(const k of TWK){const x=Math.abs(k[0]-d);if(x<bd){bd=x;best=k}}
  return {key:best[0],base:DATA.twistBase[best[1]],name:DATA.twistName[best[1]],dev:bd};
}
function ropeLookup(spec,D,struct){
  if(!RPK)RPK=Object.keys(DATA.ropeBase);
  const s=String(spec).trim();
  if(DATA.ropeBase[s]!=null)return{key:s,base:DATA.ropeBase[s],name:DATA.ropeName[s],exact:true};
  let best=null,bd=1e9;
  const core=struct.split('+')[0].replace(/[Kk]/g,'');
  for(const k of RPK){
    const m=k.match(/^([\d.]+)\s*mm/);if(!m)continue;
    const kd=parseFloat(m[1]);
    let pen=Math.abs(kd-D);
    if(!k.replace(/[Kk]/g,'').includes(core))pen+=14;
    if(pen<bd){bd=pen;best=k}
  }
  return {key:best,base:DATA.ropeBase[best],name:DATA.ropeName[best],exact:false,dev:bd};
}
/* ======================= 设备台账 ======================= */
function buildMachines(){
  const L=[];
  DATA.draw.forEach(d=>L.push({id:d.id,name:d.name,proc:'拉丝',type:d.type,lo:d.lo,hi:d.hi,kgday:d.kgday,rate:0}));
  Object.keys(DATA.twistFac).forEach(id=>L.push({id,name:'捻股机 '+id,proc:'捻股',type:'捻股机',fac:DATA.twistFac[id]}));
  Object.keys(DATA.ropeFac).forEach(id=>L.push({id,name:'合绳机 '+id,proc:'合绳',type:'合绳机',fac:DATA.ropeFac[id]}));
  return L;
}
/* ======================= 订单工艺展开 ======================= */
function buildJobs(orders,cfg){
  return orders.map((o,i)=>{
    const sp=parseSpec(o.pn,o.spec);
    const tw=twistLookup(sp.dStrand), rp=ropeLookup(o.spec,sp.D,sp.struct);
    const kg=(o.kg&&o.kg>0)?o.kg:o.qty*sp.D*sp.D*0.0034;
    const prio=o.prio||'普通';
    return {
      idx:i,no:o.no,wo:o.wo,pn:o.pn,spec:o.spec,qty:o.qty,kg,
      od:new Date(o.od+'T00:00:00').getTime(),
      due:new Date(o.due+'T23:59:59').getTime(),
      prio, rush:!!o.rush, matReady:o.matReady?new Date(o.matReady+'T00:00:00').getTime():0,
      sp,tw,rp,
      drawKg:+(kg*cfg.scrap).toFixed(1),
      strandM:Math.round(o.qty*sp.n*cfg.lay),
      ropeM:o.qty
    };
  });
}
/* ======================= 换型耗时 R3/R4/R5 ======================= */
function changeover(proc,prev,cur){
  if(!prev)return{h:0,why:'该设备首件，无换型'};
  if(proc==='拉丝'){
    if(prev.kDraw===cur.kDraw)return{h:0,why:'原料与成品规格均相同，连排免换型（R3）'};
    const a=prev.dWire,b=cur.dWire;
    const dm=Math.abs(a-b)/Math.max(a,b);
    const sameSurf=prev.surf===cur.surf;
    let h=1+dm*6+(sameSurf?0:1.2);
    h=clamp(h,1,5);
    return{h:+h.toFixed(2),why:`成品丝径 ${a}→${b}mm${sameSurf?'':'、原料表面'+prev.surf+'→'+cur.surf}，触发换型（R3），按规格切换幅度取 ${h.toFixed(1)}h（R5）`};
  }
  const pd=proc==='捻股'?prev.dStrand:prev.D, cd=proc==='捻股'?cur.dStrand:cur.D;
  const ps=prev.struct.split('+')[0], cs=cur.struct.split('+')[0];
  if(ps===cs&&Math.abs(pd-cd)<0.01)return{h:0,why:'结构与'+(proc==='捻股'?'股径':'绳径')+'均相同，连排免换型（R4）'};
  const dm=Math.abs(pd-cd)/Math.max(pd,cd);
  let h=1+dm*6+(ps===cs?0:1.5);
  h=clamp(h,1,5);
  const lab=proc==='捻股'?'股径':'绳径';
  return{h:+h.toFixed(2),why:`${ps===cs?'':'结构 '+ps+'→'+cs+'、'}${lab} ${pd.toFixed(2)}→${cd.toFixed(2)}mm，触发换型（R4），按切换幅度取 ${h.toFixed(1)}h（R5）`};
}
/* ======================= 机台时间线 ======================= */
function mkTL(machines,downs){
  const tl={};
  machines.forEach(m=>tl[m.id]={busy:[],last:null});
  (downs||[]).forEach(d=>{
    if(tl[d.mid])tl[d.mid].busy.push({s:d.s,e:d.e,down:true});
  });
  Object.values(tl).forEach(t=>t.busy.sort((a,b)=>a.s-b.s));
  return tl;
}
function earliestFit(t,ready,dur){
  let s=ready;
  for(let i=0;i<t.busy.length;i++){
    const b=t.busy[i];
    if(s+dur<=b.s)return s;
    if(s<b.e)s=b.e;
  }
  return s;
}
function place(t,s,e,down){t.busy.push({s,e,down:!!down});t.busy.sort((a,b)=>a.s-b.s)}

/* ======================= 排产主引擎 ======================= */
const PROCS=['拉丝','捻股','合绳'];
const PCOL={'拉丝':'#3FA9C9','捻股':'#E0A94B','合绳':'#5FB97A'};

function eligible(proc,job,machines){
  if(proc==='拉丝'){
    const d=job.sp.dWire;
    let L=machines.filter(m=>m.proc==='拉丝'&&d>=m.lo-1e-9&&d<=m.hi+1e-9);
    if(!L.length){
      let best=null,bd=1e9;
      machines.filter(m=>m.proc==='拉丝').forEach(m=>{
        const x=d<m.lo?m.lo-d:d-m.hi; if(x<bd){bd=x;best=m}});
      L=best?[best]:[];
    }
    return L;
  }
  if(proc==='捻股'){
    const na=(DATA.twistNA&&DATA.twistNA[String(job.tw.key)])||[];
    const L=machines.filter(m=>m.proc==='捻股'&&na.indexOf(m.id)<0);
    return L.length?L:machines.filter(m=>m.proc==='捻股');
  }
  const na2=(DATA.ropeNA&&DATA.ropeNA[String(job.rp.key)])||[];
  const L2=machines.filter(m=>m.proc==='合绳'&&na2.indexOf(m.id)<0);
  return L2.length?L2:machines.filter(m=>m.proc==='合绳');
}
function durOn(proc,job,m,share){
  share=share||1;
  if(proc==='拉丝'){
    const per=m.kgday/24, q=job.drawKg*share;
    return {h:q/Math.max(per,0.5), rate:m.kgday, unit:'kg/天', q, ql:Math.round(q).toLocaleString()+' kg'};
  }
  if(proc==='捻股'){
    const r=(job.tw.base||0)*m.fac, q=job.strandM*share;
    return {h:q/Math.max(r,0.05)/60, rate:+r.toFixed(3), unit:'m/min', q, ql:Math.round(q).toLocaleString()+' m（股）'};
  }
  const r=(job.rp.base||0)*m.fac, q=job.ropeM*share;
  return {h:q/Math.max(r,0.05)/60, rate:+r.toFixed(3), unit:'m/min', q, ql:Math.round(q).toLocaleString()+' m'};
}
// 批次数：大批量订单可在同工序多台机台并行生产（R1 同型号内可多机分担）
function lotCount(proc,job,machines,cfg){
  const cands=eligible(proc,job,machines);
  if(!cands.length)return 1;
  let best=1e18;
  for(const m of cands){const d=durOn(proc,job,m,1);if(isFinite(d.h)&&d.h>0)best=Math.min(best,d.h)}
  if(!isFinite(best))return 1;
  const capMax=proc==='拉丝'?cfg.splitDraw:(proc==='捻股'?Math.min(cfg.splitTwist,job.sp.n):(job.ropeM>=4000?cfg.splitRope:1));
  return clamp(Math.ceil(best/cfg.lotMax),1,Math.min(capMax,cands.length));
}
function prioScore(j,cfg){
  let s=0;
  if(j.rush)s-=1e12;
  if(j.prio==='重点')s-=3*D1;
  if(j.prio==='罚款')s-=2*D1;
  return j.due+s;
}

function schedule(state){
  const cfg=state.cfg, machines=state.machines;
  const jobs=buildJobs(state.orders,cfg);
  const t0=state.t0;
  const tl=mkTL(machines,state.downs);
  const locks={}; (state.locks||[]).forEach(l=>locks[l.key]=l);
  const prev=state.prevAssign||{};
  const sticky=(cfg.sticky||0)*H;
  const tasks=[], byKey={};
  const order=[...jobs].sort((a,b)=>prioScore(a,cfg)-prioScore(b,cfg));

  // 1) 先落位人工锁定的任务，算法只在剩余空间求解
  order.forEach(j=>PROCS.forEach(p=>{
    const k=j.wo+'|'+p, L=locks[k];
    if(!L||!L.lots||!L.lots.length)return;
    const lots=[];
    L.lots.forEach(x=>{
      const m=machines.find(z=>z.id===x.mid&&z.proc===p);
      if(!m)return;
      const d=durOn(p,j,m,1/L.lots.length), s=x.s, e=s+d.h*H;
      place(tl[m.id],s,e);
      lots.push({mid:m.id,mname:m.name,s,e,chS:s,chE:s,ch:{h:0,why:'人工锁定，按计划员指定机台与时刻执行'},dur:d});
    });
    if(lots.length)byKey[k]={locked:true,lots};
  }));

  // 2) 主循环
  for(const j of order){
    let ready=Math.max(t0,j.od,j.matReady||0);
    let prevEnd=null;
    for(const p of PROCS){
      const k=j.wo+'|'+p;
      const pre=byKey[k];
      let lots=[];
      if(pre&&pre.locked){
        lots=pre.lots;
        lots.forEach(l=>{tl[l.mid].last=j.sp});
      }else{
        const cands=eligible(p,j,machines).filter(m=>{const d=durOn(p,j,m,1);return isFinite(d.h)&&d.h>0});
        if(!cands.length){ready+=D1;continue}
        const K=lotCount(p,j,machines,cfg);
        // 先选出 K 台机台（按"最早完工 + λ×换型"评估），再按各机台速度按比例分摊批量，使各批同步完工
        const scored=cands.map(m=>{
          const d=durOn(p,j,m,1/K);
          const ch=changeover(p,tl[m.id].last,j.sp);
          const need=(d.h+ch.h)*H;
          const s=earliestFit(tl[m.id],ready,need);
          const pv=prev[k]; let cost=s+need+ch.h*H*cfg.wChange;
          if(pv&&pv.indexOf(m.id)>=0)cost-=sticky;
          return {m,ch,h1:durOn(p,j,m,1).h,cost};
        }).sort((a,b)=>a.cost-b.cost);
        const sel=scored.slice(0,K);
        const wsum=sel.reduce((a,x)=>a+1/x.h1,0);
        sel.forEach(x=>{
          const share=(1/x.h1)/wsum;
          const d=durOn(p,j,x.m,share);
          const ch=changeover(p,tl[x.m.id].last,j.sp);
          const need=(d.h+ch.h)*H;
          const s=earliestFit(tl[x.m.id],ready,need), e=s+need;
          place(tl[x.m.id],s,e);
          tl[x.m.id].last=j.sp;
          lots.push({mid:x.m.id,mname:x.m.name,s:s+ch.h*H,e,chS:s,chE:s+ch.h*H,ch,dur:d,share});
        });
        if(!lots.length){ready+=D1;continue}
      }
      const s=Math.min(...lots.map(l=>l.s)), e=Math.max(...lots.map(l=>l.e));
      const chS=Math.min(...lots.map(l=>l.chS));
      const gap=prevEnd==null?0:(chS-prevEnd)/H;
      const T={key:k,wo:j.wo,no:j.no,job:j,proc:p,lots,
        mid:lots.map(l=>l.mid).join('+'),mname:lots.length>1?lots.length+' 台并行':lots[0].mname,
        s,e,chS,chE:Math.min(...lots.map(l=>l.chE)),
        ch:lots[0].ch,dur:lots[0].dur,locked:!!(pre&&pre.locked),gap,
        qtyLabel:(lots.length>1?lots.length+'批 × ':'')+lots[0].dur.ql};
      tasks.push(T);byKey[k]=T;
      prevEnd=e;ready=e;
    }
  }

  // 3) R6 右移修正：压缩工序间等待
  const maxGap=cfg.maxGap*24*H;
  for(const j of jobs){
    for(let i=1;i<PROCS.length;i++){
      const up=byKey[j.wo+'|'+PROCS[i-1]], dn=byKey[j.wo+'|'+PROCS[i]];
      if(!up||!dn||up.locked)continue;
      if(dn.chS-up.e<=maxGap)continue;
      const want=dn.chS-maxGap;
      let shift=Infinity;
      up.lots.forEach(l=>{
        const t=tl[l.mid], len=l.e-l.chS;
        const others=t.busy.filter(b=>!(Math.abs(b.s-l.chS)<1&&Math.abs(b.e-l.e)<1));
        let ns=want-len, ok=true;
        for(const b of others){if(ns<b.e&&ns+len>b.s){ok=false;break}}
        shift=ok?Math.min(shift,ns-l.chS):0;
      });
      if(isFinite(shift)&&shift>0){
        up.lots.forEach(l=>{
          const t=tl[l.mid];
          t.busy.forEach(b=>{if(Math.abs(b.s-l.chS)<1&&Math.abs(b.e-l.e)<1){b.s+=shift;b.e+=shift}});
          l.s+=shift;l.e+=shift;l.chS+=shift;l.chE+=shift;
        });
        up.s+=shift;up.e+=shift;up.chS+=shift;up.chE+=shift;up.shifted=true;
        dn.gap=(dn.chS-up.e)/H;
      }
    }
  }

  const res=[];
  for(const j of jobs){
    const ts=PROCS.map(p=>byKey[j.wo+'|'+p]).filter(Boolean);
    if(ts.length<3){res.push({job:j,tasks:ts,fin:null,late:null,ok:false});continue}
    const fin=ts[2].e, late=(fin-j.due)/D1;
    res.push({job:j,tasks:ts,fin,late:+late.toFixed(2),ok:true,
      gaps:[(ts[1].chS-ts[0].e)/D1,(ts[2].chS-ts[1].e)/D1]});
  }
  return {tasks,res,tl,jobs,byKey};
}
/* ======================= 指标与风险 ======================= */
function tolOf(p){return p==='罚款'?0:3}
function analyze(plan,state){
  const horizonEnd=Math.max(...plan.tasks.map(t=>t.e),state.t0+D1);
  const span=horizonEnd-state.t0;
  const util={};
  state.machines.forEach(m=>util[m.id]={m,work:0,chg:0,down:0,n:0});
  plan.tasks.forEach(t=>t.lots.forEach(l=>{
    const u=util[l.mid];if(!u)return;
    u.work+=(l.e-l.chE);u.chg+=(l.chE-l.chS);u.n++;
  }));
  (state.downs||[]).forEach(d=>{if(util[d.mid])util[d.mid].down+=(d.e-d.s)});
  Object.values(util).forEach(u=>{
    u.pct=span>0?(u.work+u.chg)/span*100:0;
    u.chgPct=(u.work+u.chg)>0?u.chg/(u.work+u.chg)*100:0;
  });
  const risks=[];
  let onTime=0,lateSum=0,lateN=0;
  plan.res.forEach(r=>{
    if(!r.ok){risks.push({lv:1,type:'无可用产能',wo:r.job.wo,msg:`订单 ${r.job.no} 规格 ${r.job.spec} 未能找到可加工设备，工序未完整排入`});return}
    const tol=tolOf(r.job.prio);
    if(r.late<=0)onTime++;
    else{
      lateSum+=r.late;lateN++;
      if(r.late>tol)risks.push({lv:1,type:'交期不达',wo:r.job.wo,
        msg:`订单 ${r.job.no}（${r.job.prio}）预计 ${fmtD(r.fin)} 完工，超交期 ${r.late.toFixed(1)} 天，超出容忍 ${tol} 天（R8${r.job.prio==='罚款'?'，硬约束·将产生罚款':''}）`});
      else risks.push({lv:2,type:'交期预警',wo:r.job.wo,
        msg:`订单 ${r.job.no} 超交期 ${r.late.toFixed(1)} 天，在客户容忍 ${tol} 天内（R8 软约束）`});
    }
    (r.gaps||[]).forEach((g,i)=>{
      if(g>state.cfg.maxGap)risks.push({lv:2,type:'工序间隔超限',wo:r.job.wo,
        msg:`订单 ${r.job.no} ${PROCS[i]}→${PROCS[i+1]} 间隔 ${g.toFixed(1)} 天，超过 ${state.cfg.maxGap} 天上限（R6），存在半成品积压与质量风险`});
    });
    if(r.job.matReady&&r.tasks[0].s<r.job.matReady)
      risks.push({lv:1,type:'缺料',wo:r.job.wo,msg:`订单 ${r.job.no} 原材料预计 ${fmtD(r.job.matReady)} 到货，晚于拉丝开工 ${fmtD(r.tasks[0].s)}`});
  });
  Object.values(util).forEach(u=>{
    if(u.pct>95)risks.push({lv:1,type:'产能超载',mid:u.m.id,msg:`${u.m.name}（${u.m.id}）负荷 ${u.pct.toFixed(0)}%，已无缓冲，任何扰动都会顺延交期`});
    else if(u.pct>88)risks.push({lv:2,type:'产能吃紧',mid:u.m.id,msg:`${u.m.name}（${u.m.id}）负荷 ${u.pct.toFixed(0)}%`});
  });
  (state.mats||[]).forEach(m=>{
    if(m.late)risks.push({lv:1,type:'物料延迟',wo:m.wo,msg:m.msg});
  });
  const n=plan.res.length||1;
  const pcs={};
  PROCS.forEach(p=>{
    const L=Object.values(util).filter(u=>u.m.proc===p);
    pcs[p]={avg:L.reduce((a,b)=>a+b.pct,0)/(L.length||1),n:L.length,
      max:Math.max(...L.map(x=>x.pct),0),min:Math.min(...L.map(x=>x.pct),100),
      chg:L.reduce((a,b)=>a+b.chg,0)/H};
  });
  return {util,risks,pcs,span,horizonEnd,
    kpi:{onTime:onTime/n*100,onTimeN:onTime,total:n,
      avgLate:lateN?lateSum/lateN:0,lateN,
      util:Object.values(util).reduce((a,b)=>a+b.pct,0)/Object.values(util).length,
      risk1:risks.filter(r=>r.lv===1).length,risk2:risks.filter(r=>r.lv===2).length,
      makespan:span/D1,
      chgH:plan.tasks.reduce((a,t)=>a+(t.chE-t.chS),0)/H}};
}

/* ======================= 甘特图拖拽（人工干预） ======================= */
function bindGanttDrag(sc,pxh,t0){
  let dg=null;
  const down=e=>{
    const bar=e.target.closest&&e.target.closest('.gbar');
    if(!bar)return;
    const t=ST.plan.tasks.find(x=>x.key===bar.dataset.k);if(!t)return;
    dg={bar,t,li:+bar.dataset.li,x0:e.clientX,y0:e.clientY,
        left:parseFloat(bar.style.left)||0,moved:false};
    bar.style.zIndex=20;bar.style.opacity='.82';
    try{bar.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  };
  const move=e=>{
    if(!dg)return;
    const dx=e.clientX-dg.x0,dy=e.clientY-dg.y0;
    if(Math.abs(dx)>3||Math.abs(dy)>3)dg.moved=true;
    dg.bar.style.left=(dg.left+dx)+'px';
    dg.bar.title=`拖动中：${(dx/pxh>=0?'+':'')}${(dx/pxh).toFixed(1)} 小时`;
  };
  const up=e=>{
    if(!dg)return;
    const d=dg;dg=null;
    d.bar.style.opacity='';d.bar.style.zIndex='';
    if(!d.moved){ST.sel=d.t.key;openWhy(d.t.wo,d.t.proc);return}
    const dh=Math.round((e.clientX-d.x0)/pxh*4)/4; // 15 分钟粒度
    let mid=null;
    if(ST.gView==='machine'){
      d.bar.style.visibility='hidden';
      const el=document.elementFromPoint(e.clientX,e.clientY);
      d.bar.style.visibility='';
      const row=el&&el.closest?el.closest('.grow'):null;
      if(row&&row.dataset.mid)mid=row.dataset.mid;
    }
    applyGanttDrag(d.t,d.li,dh,mid);
  };
  sc.addEventListener('pointerdown',down);
  sc.addEventListener('pointermove',move);
  sc.addEventListener('pointerup',up);
  sc.addEventListener('pointercancel',()=>{dg=null});
}
function applyGanttDrag(t,li,dh,mid){
  const lot=t.lots[li];if(!lot)return;
  let nm=mid||lot.mid;
  if(mid&&mid!==lot.mid){
    const ok=eligible(t.proc,t.job,ST.machines).some(m=>m.id===mid);
    if(!ok){toast(`机台 ${mid} 不能加工本规格（R1 设备—规格适配矩阵），已保持原机台`);nm=lot.mid}
  }
  let ns=lot.chS+dh*H;
  if(ns<ST.t0)ns=ST.t0;
  ST.locks=ST.locks.filter(l=>l.key!==t.key);
  ST.locks.push({key:t.key,wo:t.wo,proc:t.proc,manual:true,
    lots:t.lots.map((l,i)=>i===li?{mid:nm,s:ns}:{mid:l.mid,s:l.chS})});
  run(true);
  toast(`${t.no} ${t.proc} 已${nm!==lot.mid?'改派至 '+nm+' 并':''}调整开工 ${dh>=0?'+':''}${dh} 小时，已锁定重算`);
}

function procOfQuality(q){
  const s=(q.loc||'')+' '+(q.desc||'')+' '+(q.mat||'');
  if(/捻股/.test(s))return '捻股';
  if(/合绳/.test(s))return '合绳';
  if(/拉丝|钢丝(?!绳)/.test(s))return '拉丝';
  return '其他';
}
function causeCat(q){
  const s=(q.cause||'')+' '+(q.desc||'');
  if(/停电|电网|设备|故障|工装/.test(s))return '设备与外部条件';
  if(/强度|материал|原材|钢丝规格|涂塑/.test(s))return '来料/半成品质量';
  if(/工艺|捻距|参数|按工单|未严格|操作|排线|焊接/.test(s))return '工艺执行与操作';
  if(/查找|未明/.test(s))return '原因待查';
  return '其他';
}

function readFile(e,cb){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{
    const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    cb(rows);
  }catch(err){toast('读取失败：'+err.message)}};
  r.readAsArrayBuffer(f);
}
function pick(row,keys,dft){
  for(const k of Object.keys(row)){
    const kk=String(k).replace(/\s/g,'');
    for(const t of keys)if(kk.includes(t))if(row[k]!==''&&row[k]!=null)return row[k];
  }
  return dft;
}
function toDate(v,dft){
  if(!v)return dft;
  if(v instanceof Date)return fmtD(v.getTime());
  const s=String(v).trim();
  const d=new Date(s.replace(/\//g,'-'));
  return isNaN(d)?dft:fmtD(d.getTime());
}
function importOrders(rows){
  if(!rows.length)return toast('文件为空');
  const os=[];
  rows.forEach((r,i)=>{
    const spec=String(pick(r,['规格','spec'],'')).trim();
    const qty=+String(pick(r,['业务数量','数量','qty'],0)).replace(/[^\d.]/g,'')||0;
    if(!spec||!qty)return;
    const od=toDate(pick(r,['订单日期','单据日期','下单'],null),fmtD(Date.now()));
    const due=toDate(pick(r,['预发货日','交期','预到货日','交货'],null),fmtD(new Date(od).getTime()+10*D1));
    const no=String(pick(r,['项目编号','订单号','订单编号'],'IMP-'+(i+1)));
    os.push({no,wo:String(pick(r,['内部订单','工单'],no+'-'+(i+1))),od,due,
      pn:String(pick(r,['品名','产品'],'光面压实钢丝绳')),spec,coat:String(pick(r,['涂层'],'')),
      qty,kg:+String(pick(r,['计价数量','重量','kg'],0)).replace(/[^\d.]/g,'')||0,
      done:'未结束',prio:String(pick(r,['优先级','客户类别','等级'],'普通')).includes('重')?'重点':(String(pick(r,['优先级','客户类别'],'')).includes('罚')?'罚款':'普通'),
      rush:/紧急|插单/.test(String(pick(r,['备注','标记','紧急'],''))),matReady:null});
  });
  if(!os.length)return toast('未识别到有效订单行，请检查"规格"与"数量"列');
  ST.orders=os;ST.base=null;ST.locks=[];run(false);
  toast(`已导入 ${os.length} 张订单并完成排产`);
}
function importMach(rows){
  const L=[];
  rows.forEach(r=>{
    const id=String(pick(r,['设备编号','机台','编号','id'],'')).trim();
    if(!id)return;
    const proc=String(pick(r,['工序','proc'],'')).trim()||(id.startsWith('81')?'拉丝':id.startsWith('82')?'捻股':'合绳');
    const o={id,name:String(pick(r,['设备名称','名称'],proc+id)),proc,type:proc+'机'};
    if(proc==='拉丝'){o.lo=+pick(r,['规格下限','下限','lo'],0.2);o.hi=+pick(r,['规格上限','上限','hi'],5);
      o.kgday=+pick(r,['日产能','产能','kgday'],2000);}
    else o.fac=+pick(r,['速度系数','系数','fac'],1)||1;
    L.push(o);

async function save(filename,data){
  try{
    const dl=await claude.use('downloads');
    if(!dl){toast('当前视图不支持文件保存');return}
    await dl.save({filename,data});
    toast('已保存 '+filename);
  }catch(e){
    if(e&&e.code==='declined')toast('已取消保存');
    else toast('保存失败：'+((e&&e.message)||e));
  }
}
function sheetBuf(sheets){

function exportGantt(view){
  view=view||ST.gView;
  const t0=ST.t0,t1=ST.ana.horizonEnd,days=Math.ceil((t1-t0)/D1)+1;
  const px=2.4,LW=210,W=LW+days*24*px+24;
  const rows=[];
  if(view==='machine'){
    PROCS.forEach(p=>{
      const ms=ST.machines.filter(m=>m.proc===p).sort((a,b)=>a.id.localeCompare(b.id));
      let first=true;
      ms.forEach(m=>{
        const ts=[];
        ST.plan.tasks.forEach(t=>t.lots.forEach(l=>{if(l.mid===m.id)ts.push({proc:t.proc,no:t.no,chS:l.chS,chE:l.chE,e:l.e})}));
        if(!ts.length)return;
        const u=ST.ana.util[m.id];
        rows.push({head:first?p+'工段':null,proc:p,
          lab:m.id+'  '+m.name,sub:(u?u.pct.toFixed(0):'0')+'%',ts});
        first=false;
      });
    });
  }else{
    [...ST.plan.res].sort((a,b)=>a.job.due-b.job.due).slice(0,160).forEach(r=>{
      const ts=[];r.tasks.forEach(t=>t.lots.forEach(l=>ts.push({proc:t.proc,no:l.mid,chS:l.chS,chE:l.chE,e:l.e})));
      rows.push({lab:r.job.no+'  '+r.job.spec.slice(0,18),sub:r.ok?(r.late>0?'+'+r.late.toFixed(1)+'d':'准时'):'—',ts,due:r.job.due});
    });
  }
  const RH=17,TOP=56,Hh=TOP+rows.length*RH+34;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Hh}" font-family="Helvetica,Arial,sans-serif" font-size="9">
  <rect width="${W}" height="${Hh}" fill="#0E1419"/>
  <text x="10" y="20" fill="#E6EDF3" font-size="14">君威钢绳索具 · 排产甘特图（${view==='machine'?'设备视角 · 按工段分组到具体机台':'订单视角 · 条内标注机台编号'}）</text>
  <text x="10" y="36" fill="#8CA0B1">计划起点 ${fmtD(t0)}　跨度 ${days} 天　准时交付率 ${ST.ana.kpi.onTime.toFixed(1)}%　设备平均负荷 ${ST.ana.kpi.util.toFixed(1)}%　导出 ${fmtDT(Date.now())}</text>`;
  for(let d=0;d<days;d++){
    const x=LW+d*24*px;
    s+=`<line x1="${x.toFixed(1)}" y1="${TOP-12}" x2="${x.toFixed(1)}" y2="${Hh-22}" stroke="#26333F"/>`;
    if(d%2===0)s+=`<text x="${(x+2).toFixed(1)}" y="${TOP-3}" fill="#5E7384">${fmtD(t0+d*D1).slice(5)}</text>`;
  }
  rows.forEach((r,i)=>{
    const y=TOP+i*RH;
    if(r.head)s+=`<rect x="0" y="${y-1}" width="${W}" height="${RH}" fill="#182633"/><text x="6" y="${y+11}" fill="${PCOL[r.proc]}" font-size="10">▌${esc(r.head)}</text>`;
    else{
      if(i%2)s+=`<rect x="0" y="${y-1}" width="${W}" height="${RH}" fill="#121A22"/>`;
      s+=`<text x="8" y="${y+11}" fill="#C6D3DE">${esc(r.lab).slice(0,26)}</text>`;
      s+=`<text x="${LW-30}" y="${y+11}" fill="#5E7384">${esc(r.sub||'')}</text>`;
    }
    if(r.due!=null)s+=`<line x1="${(LW+(r.due-t0)/H*px).toFixed(1)}" y1="${y}" x2="${(LW+(r.due-t0)/H*px).toFixed(1)}" y2="${y+RH-2}" stroke="#E4574C" stroke-dasharray="2,2"/>`;
    (r.ts||[]).forEach(t=>{
      const x=LW+(t.chE-t0)/H*px,w=Math.max((t.e-t.chE)/H*px,1.4);
      const cx=LW+(t.chS-t0)/H*px,cw=(t.chE-t.chS)/H*px;
      if(cw>0.4)s+=`<rect x="${cx.toFixed(1)}" y="${y+3}" width="${cw.toFixed(1)}" height="10" fill="#4A5766"/>`;
      s+=`<rect x="${x.toFixed(1)}" y="${y+3}" width="${w.toFixed(1)}" height="10" fill="${PCOL[t.proc]}" rx="1"/>`;
      if(w>34)s+=`<text x="${(x+2).toFixed(1)}" y="${y+11}" fill="#06171D" font-size="7">${esc(String(t.no)).slice(0,10)}</text>`;
    });
  });
  s+=`<text x="10" y="${Hh-8}" fill="#5E7384">■ 蓝=拉丝　■ 黄=捻股　■ 绿=合绳　■ 灰=换型（R3–R5）　红虚线=交期　行首为机台编号与名称，右侧为该机台负荷率</text></svg>`;
  save('君威甘特图_'+(view==='machine'?'设备视角':'订单视角')+'_'+fmtD(Date.now())+'.svg',s);
}

function renderRule(){
  const R=[['R1','排产单位','按设备型号排产；订单先匹配可加工它的设备型号，同型号内按紧急程度、先后顺序排产','设备—产品适配关系直接取自两张矩阵表：捻股/合绳表中某规格在某机台列下无数据即判定"不适配"，该机台不进入候选；拉丝按设备的丝径区间判定。候选确定后择"最早完工 + λ×换型代价"最优者'],
  ['R2','班次日历','两班倒、每班12小时、全天24小时连续生产','时间轴按 24h 连续推进，不切分班次；工单上标注开工所属白班/夜班'],
  ['R3','换型判定（拉丝）','成品和原料有一个不同就要换型','换型键 = 表面处理(原料) + 成品丝径；任一不同即触发'],
  ['R4','换型判定（捻股、合绳）','结构和（绳）股径有一个不同就要换型','换型键 = 股结构 + 股径/绳径；任一不同即触发'],
  ['R5','换型耗时','1–5 小时不等，随规格切换幅度变化','h = clamp(1 + 相对径差×6 + 结构/表面切换惩罚, 1, 5)，结果写入甘特图灰色斜纹段与工单'],
  ['R6','工序间隔','相邻工序允许间隔等待，须控制在 3 天以内','排完后做上游右移：在不与其他任务冲突的前提下把上道工序尽量后推，压缩半成品等待；仍超限则列为风险'],
  ['R7','订单字段','订单号、规格、数量、交期','导入时模糊匹配列名，缺失交期按订单日期 +10 天兜底'],
  ['R8','交期约束','部分客户延期罚款（硬约束），部分可容忍 ≤3 天（软约束）','客户类别"罚款"容忍 0 天、"普通/重点"容忍 3 天；超容忍列高危风险，容忍内列预警'],
  ['R9','优先级规则','重点客户、重点订单优先生产','排序键 = 交期 − 优先级提前量（插单 −∞、重点 −3天、罚款 −2天）'],
  ['R10','插单频率','紧急插单约每周 5 次','插单面板一键注入新订单并全局重排，重排结果与基准方案逐单对比量化']];
  let h=`<div class="panel"><h3>业务规则与约束字典 → 算法映射 <span class="sub">评审"约束可解释"对照表</span></h3>
   <div class="tw"><table><thead><tr><th>#</th><th>规则</th><th>企业口径</th><th>本系统的建模与实现</th></tr></thead><tbody>`;
  R.forEach(r=>h+=`<tr><td class="mono" style="color:var(--p1)">${r[0]}</td><td>${esc(r[1])}</td>
    <td style="white-space:normal;max-width:300px;color:var(--mut)">${esc(r[2])}</td>
    <td style="white-space:normal;max-width:460px">${esc(r[3])}</td></tr>`);
  h+=`</tbody></table></div></div>`;
  h+=`<div class="grid g2">
  <div class="panel"><h3>排产算法</h3><div class="pad hint" style="line-height:1.8">
   <b style="color:var(--ink)">1. 订单展开</b>：每张订单按规格解析出绳径/结构/股数/绳芯，推导股径与钢丝径，拆成 拉丝 → 捻股 → 合绳 三道工序任务。<br>
   <b style="color:var(--ink)">2. 优先级排序</b>：以 EDD（最早交期优先）为主轴，叠加 R9 优先级提前量与 R10 插单置顶。<br>
   <b style="color:var(--ink)">3. 逐工序择机</b>：对每个候选机台计算「换型时长 + 加工时长」，在该机台空闲区间内找最早可容纳窗口，取 <span class="mono">完工时刻 + λ×换型时长</span> 最小者（λ=${ST.cfg.wChange}，用于在交期与效率之间平衡）。<br>
   <b style="color:var(--ink)">4. 链式推进</b>：下道工序最早开工 = 上道完工；物料延迟、设备停机以时间窗形式占用机台或抬高就绪时间。<br>
   <b style="color:var(--ink)">5. R6 右移修正</b>：对间隔超 3 天的工序对，把上游任务在不冲突范围内尽量右移，减少半成品积压。<br>
   <b style="color:var(--ink)">6. 人工干预</b>：三种方式——① 依据面板锁定/改派/改客户等级；② 甘特图上直接拖拽色块（左右改开工时刻，上下换机台，15 分钟粒度）；③ 插单时在三套处理方案中拍板。被人工确定的安排在重算时作为固定占位先行落位，算法只在剩余空间求解。<br>
   <b style="color:var(--ink)">7. 少扰动重排</b>：重排时读取上一版的机台分配，对"仍排在原机台"的方案给予成本减免（${ST.cfg.sticky}h 当量），因此扰动后 95%+ 的订单交期与机台保持不变，而不是推倒重来。<br>
   <b style="color:var(--ink)">目标函数</b>：准时交付率为首要目标，设备利用率为次要目标（通过换型压缩与最早完工择机间接优化）。
  </div></div>
  <div class="panel"><h3>数据口径与已知近似</h3><div class="pad hint" style="line-height:1.8">
   · <b style="color:var(--ink)">拉丝产能</b>：《产品额定》拉丝表给出样本期产量，按全厂月产 2,900 吨口径归一化为各机台日产能（kg/天）。<br>
   · <b style="color:var(--ink)">捻股/合绳速度</b>：原表每个规格行对 50/12 台机台给出速度，经校验各机台恒为基准速度的固定倍率，故压缩为「规格基准速度 × 机台系数」，与原表数值完全等价。<br>
   · <b style="color:var(--ink)">股径推导</b>：d ≈ D·sin(π/n)/(1+sin(π/n))，n 为外层股数；6 股绳得 D/3，与工程经验一致。<br>
   · <b style="color:var(--ink)">钢丝径推导</b>：按股内丝数折算层数（7丝/3、19丝/5、26–36丝/7）。<br>
   · <b style="color:var(--ink)">客户类别</b>：原始订单表未含客户分级字段，系统按"大批量/工程机械等关键品名"预置为重点、其余为普通，可在计划表逐单改判或由导入列覆盖。<br>
   · <b style="color:var(--ink)">设备—规格适配矩阵</b>：本数据包两张矩阵表无空缺，因此捻股 50 台、合绳 12 台对样例规格全部适配；导入新数据若出现空缺，系统会自动按"不适配"剔除该机台（R1）。<br>
   · <b style="color:var(--ink)">绳芯</b>：合绳工艺表为"绳子+绳芯"口径，绳芯工时已包含在合绳速度中。<br>
   以上近似均在排产依据中逐条显示，评审与计划员可核对并用真实工艺参数替换。
  </div></div></div>`;
  $('#v-rule').innerHTML=h;
}
/* ======================= 初始化 ======================= */
const VIEWS={'v-dash':renderDash,'v-plan':renderPlan,'v-gantt':renderGantt,
  'v-dis':renderDis,'v-sc':renderSc,'v-ana':renderAna,'v-data':renderData,'v-rule':renderRule};
let dirty={};
function cur(){const b=$('#tabs button.on');return (b&&b.dataset&&VIEWS[b.dataset.v])?b.dataset.v:'v-dash'}
function ensure(id){const f=VIEWS[id];if(f&&dirty[id]!==false){f();dirty[id]=false}}
function renderAll(){
  $('#pHorizon').innerHTML='计划起点 <b>'+fmtD(ST.t0)+'</b>';
  $('#pScale').innerHTML='订单 <b>'+ST.orders.length+'</b> · 工序 <b>'+ST.plan.tasks.length+'</b>';
  Object.keys(VIEWS).forEach(k=>dirty[k]=true);
  ensure(cur());
}
$('#tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  $$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v));
  ensure(b.dataset.v);
  window.scrollTo(0,0);const m=document.querySelector('main');if(m)m.scrollTop=0;
};
$('#bRun').onclick=()=>run(true);
$('#bUndo').onclick=()=>{
  const h=ST.hist.pop();if(!h)return;
  ST.orders=h.orders;ST.downs=h.downs;ST.locks=h.locks;ST.cfg=h.cfg;
  run(false);toast('已撤销到上一版方案');
};
$('#dwClose').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
ST.orders=seedOrders();
run(false);
/* ======================= 试算（不改动当前状态） ======================= */
function curAssign(){
  const m={};if(ST.plan)ST.plan.tasks.forEach(t=>m[t.key]=t.lots.map(l=>l.mid));return m;
}
function trial(over){
  const st={
    orders:over.orders||ST.orders,machines:ST.machines,
    downs:over.downs||ST.downs,locks:over.locks||ST.locks,mats:over.mats||ST.mats,
    cfg:ST.cfg,prevAssign:curAssign()
  };
  st.t0=Math.min(...st.orders.map(o=>new Date(o.od+'T00:00:00').getTime()));
  const p=schedule(st);
  return {plan:p,ana:analyze(p,st),st};
}
function diffVs(basePlan,newPlan){
  const b={};basePlan.res.forEach(r=>b[r.job.wo]={late:r.late,mids:r.tasks.map(t=>t.mid).join('|')});
  let moved=0,worse=0,sumWorse=0,maxWorse=0,remach=0,newN=0;
  newPlan.res.forEach(r=>{
    const o=b[r.job.wo];
    if(!o){newN++;return}
    if(!r.ok||o.late==null)return;
    const d=r.late-o.late;
    if(Math.abs(d)>0.05){moved++;if(d>0){worse++;sumWorse+=d;maxWorse=Math.max(maxWorse,d)}}
    if(r.tasks.map(t=>t.mid).join('|')!==o.mids)remach++;
  });
  return {moved,worse,sumWorse:+sumWorse.toFixed(1),maxWorse:+maxWorse.toFixed(1),remach,newN,
    total:newPlan.res.length,stable:+((1-moved/Math.max(newPlan.res.length,1))*100).toFixed(1)};
}
/* ======================= 插单处理选项 ======================= */
let OPTS=null;
function buildInsertOptions(nd){
  busy(true,'正在试算三种处理方案…');
  setTimeout(()=>{
    try{
      const A=ST.orders.concat([Object.assign({},nd,{rush:true})]);
      const B=ST.orders.concat([Object.assign({},nd,{rush:false})]);
      const later=fmtD(new Date(nd.due).getTime()+7*D1);
      const C=ST.orders.concat([Object.assign({},nd,{rush:false,due:later})]);
      const rA=trial({orders:A}),rB=trial({orders:B}),rC=trial({orders:C});
      const base=ST.plan;
      OPTS=[
        {k:'A',name:'接受插单 · 置于最高优先',orders:A,r:rA,
         note:'插单排序置顶（R10），优先占用最早可用机台；对既有订单扰动最大。'},
        {k:'B',name:'接受插单 · 按交期正常排队',orders:B,r:rB,
         note:'插单不特权，仅按 EDD 与客户等级参与排序；扰动小，但插单本身可能逾期。'},
        {k:'C',name:'接受插单 · 与客户协商交期顺延 7 天',orders:C,r:rC,
         note:'交期放宽到 '+later+'，用交期换产能，既有订单几乎不受影响。'}
      ].map(o=>Object.assign(o,{d:diffVs(base,o.r.plan),
        self:o.r.plan.res.find(x=>x.job.wo===nd.wo)}));
      renderOptions(nd);
    }catch(e){console.error(e);toast('试算失败：'+e.message)}
    busy(false);
  },30);
}
function renderOptions(nd){
  const p=$('#optPanel'),b=$('#optBody');if(!p)return;
  p.style.display='';
  let h=`<div class="hint" style="margin-bottom:10px">插单 <b style="color:var(--ink)">${esc(nd.no)}</b> ${esc(nd.spec)} · ${nd.qty.toLocaleString()} m · 交期 ${esc(nd.due)} · 客户 ${esc(nd.prio)}。以下为三种处理方式的量化对比，由计划员拍板。</div>
  <div class="tw"><table><thead><tr><th>方案</th><th>插单结果</th><th class="num">全厂准时率</th><th class="num">延期订单</th>
  <th class="num">被改变交期</th><th class="num">新增延误(天)</th><th class="num">最大单张(天)</th><th class="num">方案稳定度</th><th class="num">设备负荷</th><th></th></tr></thead><tbody>`;
  OPTS.forEach(o=>{
    const k=o.r.ana.kpi,s=o.self;
    const selfTxt=s&&s.ok?(s.late<=0?`<span class="tag t-ok">准时 富余${(-s.late).toFixed(1)}天</span>`
      :s.late>tolOf(nd.prio)?`<span class="tag t-risk">逾期${s.late.toFixed(1)}天</span>`
      :`<span class="tag t-warn">逾期${s.late.toFixed(1)}天·容忍内</span>`):'<span class="tag t-risk">未排入</span>';
    h+=`<tr><td><b>${o.k}</b> ${esc(o.name)}<br><span style="color:var(--dim);white-space:normal">${esc(o.note)}</span></td>
    <td>${selfTxt}</td><td class="num">${k.onTime.toFixed(1)}%</td><td class="num">${k.lateN}</td>
    <td class="num">${o.d.moved}</td><td class="num" style="color:${o.d.sumWorse>0?'var(--risk)':'var(--ok)'}">${o.d.sumWorse}</td>
    <td class="num">${o.d.maxWorse}</td><td class="num">${o.d.stable}%</td><td class="num">${k.util.toFixed(1)}%</td>
    <td><button class="btn sm pri optApply" data-k="${o.k}">采用</button></td></tr>`;
  });
  h+=`</tbody></table></div>
  <div class="hint" style="margin-top:9px">方案稳定度＝交期未被改变的订单占比，对应赛题"尽量少扰动未受影响的订单"；采用后仍可在甘特图上拖拽微调。</div>`;
  b.innerHTML=h;
  $$('.optApply').forEach(x=>x.onclick=()=>{
    const o=OPTS.find(z=>z.k===x.dataset.k);if(!o)return;
    ST.orders=o.orders;run(true);
    toast('已采用方案 '+o.k+'：'+o.name);
    p.style.display='none';
  });
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}
/* ======================= 方案库 ======================= */
function snapState(){return JSON.parse(JSON.stringify({orders:ST.orders,downs:ST.downs,locks:ST.locks,mats:ST.mats,cfg:ST.cfg}))}
function saveScenario(name){
  const k=ST.ana.kpi;
  const sc={id:'S'+Date.now(),name:name||('方案 '+(ST.scenarios.length+1)),time:Date.now(),
    kpi:{onTime:+k.onTime.toFixed(1),lateN:k.lateN,avgLate:+k.avgLate.toFixed(2),util:+k.util.toFixed(1),
         chgH:+k.chgH.toFixed(0),makespan:+k.makespan.toFixed(1),risk1:k.risk1,risk2:k.risk2,total:k.total},
    meta:{orders:ST.orders.length,locks:ST.locks.length,downs:ST.downs.length,mats:ST.mats.length},
    state:snapState(),
    res:ST.plan.res.map(r=>({wo:r.job.wo,no:r.job.no,due:r.job.due,late:r.late,fin:r.fin,
      mids:r.tasks.map(t=>t.mid)}))};
  ST.scenarios.push(sc);persistSc();return sc;
}
function persistSc(){try{localStorage.setItem('jw_public_demo_v1',JSON.stringify(ST.scenarios))}catch(e){}}
function loadSc(){try{const x=localStorage.getItem('jw_public_demo_v1');if(x)ST.scenarios=JSON.parse(x)||[]}catch(e){ST.scenarios=[]}}
function applyScenario(id){
  const s=ST.scenarios.find(x=>x.id===id);if(!s)return;
  ST.orders=JSON.parse(JSON.stringify(s.state.orders));
  ST.downs=JSON.parse(JSON.stringify(s.state.downs));
  ST.locks=JSON.parse(JSON.stringify(s.state.locks));
  ST.mats=JSON.parse(JSON.stringify(s.state.mats));
  ST.cfg=Object.assign({},ST.cfg,s.state.cfg);
  run(true);toast('已载入 '+s.name);
}
let scSel=[];
function renderSc(){
  let h=`<div class="panel"><h3>方案库 <span class="sub">多套排产方案并存，可随时载入、对比、导出；保存在本机浏览器</span><span class="sp"></span>
    <button class="btn sm pri" id="scSave">把当前方案存入方案库</button>
    <button class="btn sm" id="scClear">清空方案库</button></h3><div class="pad">`;
  if(!ST.scenarios.length){
    h+=`<div class="empty">方案库是空的。先在「插单与异常重排」里制造一个场景，或直接点右上角保存当前方案，再存第二个方案即可逐单对比。</div>`;
  }else{
    h+=`<div class="tw"><table><thead><tr><th>对比</th><th>方案名</th><th>保存时间</th><th class="num">准时率</th>
     <th class="num">延期</th><th class="num">平均延误</th><th class="num">设备负荷</th><th class="num">换型h</th>
     <th class="num">跨度天</th><th class="num">高危</th><th>构成</th><th></th></tr></thead><tbody>`;
    ST.scenarios.forEach(s=>{
      h+=`<tr><td><input type="checkbox" class="scCk" data-id="${s.id}" ${scSel.indexOf(s.id)>=0?'checked':''} style="width:auto"></td>
      <td><input type="text" class="scNm" data-id="${s.id}" value="${esc(s.name)}" style="width:150px"></td>
      <td style="color:var(--mut)">${fmtDT(s.time)}</td>
      <td class="num">${s.kpi.onTime}%</td><td class="num">${s.kpi.lateN}</td><td class="num">${s.kpi.avgLate}</td>
      <td class="num">${s.kpi.util}%</td><td class="num">${s.kpi.chgH}</td><td class="num">${s.kpi.makespan}</td>
      <td class="num" style="color:${s.kpi.risk1?'var(--risk)':'var(--ok)'}">${s.kpi.risk1}</td>
      <td style="color:var(--dim)">订单${s.meta.orders} 锁定${s.meta.locks} 停机${s.meta.downs} 缺料${s.meta.mats}</td>
      <td><button class="btn sm scLoad" data-id="${s.id}">载入</button>
          <button class="btn sm scDel" data-id="${s.id}">删除</button></td></tr>`;
    });
    h+=`</tbody></table></div><div class="hint">勾选 2–3 个方案即可在下方看到 KPI 与逐单交期差异；「载入」会把该方案的订单、锁定、停机、缺料全部恢复并重算。</div>`;
  }
  h+=`</div></div><div id="scCmp"></div>`;
  $('#v-sc').innerHTML=h;
  $('#scSave').onclick=()=>{saveScenario();renderSc();toast('已存入方案库')};
  $('#scClear').onclick=()=>{ST.scenarios=[];scSel=[];persistSc();renderSc();toast('方案库已清空')};
  $$('.scCk').forEach(c=>c.onchange=()=>{
    const id=c.dataset.id;
    if(c.checked){if(scSel.indexOf(id)<0)scSel.push(id);if(scSel.length>3)scSel.shift()}
    else scSel=scSel.filter(x=>x!==id);
    renderSc();
  });
  $$('.scNm').forEach(i=>i.onchange=()=>{
    const s=ST.scenarios.find(x=>x.id===i.dataset.id);if(s){s.name=i.value;persistSc()}});
  $$('.scLoad').forEach(b=>b.onclick=()=>applyScenario(b.dataset.id));
  $$('.scDel').forEach(b=>b.onclick=()=>{
    ST.scenarios=ST.scenarios.filter(x=>x.id!==b.dataset.id);
    scSel=scSel.filter(x=>x!==b.dataset.id);persistSc();renderSc()});
  renderScCmp();
}
function renderScCmp(){
  const e=$('#scCmp');if(!e)return;
  const L=scSel.map(id=>ST.scenarios.find(s=>s.id===id)).filter(Boolean);
  if(L.length<2){e.innerHTML='';return}
  const rows=[['准时交付率 %','onTime',1],['延期订单数','lateN',0],['平均延误 天','avgLate',0],
    ['设备平均负荷 %','util',1],['换型总耗时 h','chgH',0],['计划跨度 天','makespan',0],['高危风险项','risk1',0]];
  let h=`<div class="panel"><h3>方案对比 <span class="sub">${L.map(s=>esc(s.name)).join(' ／ ')}</span>
    <span class="sp"></span><button class="btn sm" id="scExp">导出对比表</button></h3><div class="pad">
    <div class="tw"><table><thead><tr><th>指标</th>${L.map(s=>`<th class="num">${esc(s.name)}</th>`).join('')}<th>最优</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const vals=L.map(s=>{const v=s.kpi[r[1]];return (typeof v==='number'&&isFinite(v))?v:null});
    let bi=-1;vals.forEach((v,i)=>{if(v==null)return;if(bi<0||(r[2]?v>vals[bi]:v<vals[bi]))bi=i});
    h+=`<tr><td>${r[0]}</td>${vals.map((v,i)=>`<td class="num"${i===bi?' style="color:var(--ok);font-weight:600"':''}>${v==null?'—':v}</td>`).join('')}
      <td style="color:var(--mut)">${bi>=0?esc(L[bi].name):'—'}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  // 逐单差异
  const base=L[0],map={};base.res.forEach(r=>map[r.wo]=r);
  const diff=[];
  const others=L.slice(1);
  const wos=new Set();L.forEach(s=>s.res.forEach(r=>wos.add(r.wo)));
  wos.forEach(wo=>{
    const cells=L.map(s=>s.res.find(r=>r.wo===wo));
    if(cells.some(c=>!c))return diff.push({wo,cells,onlyIn:true});
    const lates=cells.map(c=>c.late);
    if(Math.max.apply(null,lates)-Math.min.apply(null,lates)>0.05)diff.push({wo,cells});
  });
  h+=`<div class="hint" style="margin:12px 0 7px"><b style="color:var(--ink)">逐单交期差异</b>：共 ${diff.length} 张订单在这些方案之间结果不同（含仅出现在某一方案中的插单）。</div>`;
  if(diff.length){
    h+=`<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th>订单号</th><th>交期</th>
      ${L.map(s=>`<th class="num">${esc(s.name)} 偏差/机台</th>`).join('')}</tr></thead><tbody>`;
    diff.slice(0,80).forEach(d=>{
      const any=d.cells.find(Boolean);
      h+=`<tr><td class="mono">${esc(any.no)}</td><td>${any.due?fmtD(any.due):''}</td>`;
      d.cells.forEach(c=>{
        h+=c?`<td class="num" style="color:${c.late>0?'var(--risk)':'var(--ok)'}">${c.late>0?'+':''}${c.late}天<br>
          <span class="mono" style="color:var(--dim);font-size:10.5px">${esc((c.mids||[]).join(' → '))}</span></td>`
          :`<td class="num" style="color:var(--dim)">未包含</td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  h+=`</div></div>`;
  e.innerHTML=h;
  $('#scExp').onclick=()=>{
    const sheets=[['KPI对比',rows.map(r=>{
      const o={'指标':r[0]};L.forEach(s=>o[s.name]=s.kpi[r[1]]);return o})]];
    sheets.push(['逐单差异',diff.map(d=>{
      const any=d.cells.find(Boolean);const o={'订单号':any.no,'交期':any.due?fmtD(any.due):''};
      L.forEach((s,i)=>{const c=d.cells[i];o[s.name+'·偏差天']=c?c.late:'未包含';o[s.name+'·机台']=c?(c.mids||[]).join(' → '):''});
      return o})]);
    save('君威方案对比_'+fmtD(Date.now())+'.xlsx',sheetBuf(sheets));
  };
}
/* ======================= 启动补丁 ======================= */
loadSc();
$('#bSave').onclick=()=>{saveScenario();dirty['v-sc']=true;toast('已存入方案库，可在「方案对比」页查看');};

</script>
